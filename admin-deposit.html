<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>입금내역 업로드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px;
      background: #f7f7f7;
      color: #222;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 24px;
      margin: 0 0 12px;
    }

    .notice {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    input,
    button {
      width: 100%;
      font-size: 16px;
      padding: 14px;
      margin-top: 12px;
      box-sizing: border-box;
    }

    input {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    button {
      background: #ffd84d;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .summary {
      margin-top: 20px;
      padding: 14px;
      background: #f2f4f7;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.6;
      display: none;
    }

    pre {
      white-space: pre-wrap;
      background: #222;
      color: #fff;
      padding: 16px;
      border-radius: 12px;
      margin-top: 20px;
      font-size: 13px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 18px;
      font-size: 13px;
      background: #fff;
      display: none;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    th {
      background: #f0f0f0;
    }

    .ok {
      color: #0a7a2f;
      font-weight: 700;
    }

    .warn {
      color: #b26a00;
      font-weight: 700;
    }

    .fail {
      color: #c62828;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>입금내역 이미지 업로드</h1>

    <p class="notice">
      통장 거래내역 이미지를 업로드하면 거래일시, 동, 호수, 이름, 거래금액을 추출하여
      구글 시트로 전송합니다.
    </p>

    <input type="file" id="depositImage" accept="image/*">

    <button type="button" id="uploadBtn" onclick="uploadDepositImage()">
      거래내역 추출하기
    </button>

    <div id="summary" class="summary"></div>

    <table id="resultTable">
      <thead>
        <tr>
          <th>거래일시</th>
          <th>동</th>
          <th>호수</th>
          <th>이름</th>
          <th>거래금액</th>
          <th>확인결과</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <pre id="result">업로드 대기 중</pre>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwOphX4u_qfDItzAy185O-K6UBW8HyWWMd2YWJpW9AVsrZr7ElUxqB5BrTxR7jr10m5/exec';
    

    async function uploadDepositImage() {
      const fileInput = document.getElementById('depositImage');
      const resultBox = document.getElementById('result');
      const uploadBtn = document.getElementById('uploadBtn');
      const summaryBox = document.getElementById('summary');
      const table = document.getElementById('resultTable');
      const tbody = table.querySelector('tbody');

      const file = fileInput.files[0];

      if (!file) {
        alert('입금내역 이미지를 선택해주세요.');
        return;
      }

      if (SCRIPT_URL === 'APPS_SCRIPT_URL_HERE') {
        alert('Apps Script URL이 아직 입력되지 않았습니다.');
        return;
      }

      uploadBtn.disabled = true;
      resultBox.textContent = '이미지를 처리 중입니다. 잠시만 기다려주세요.';
      summaryBox.style.display = 'none';
      table.style.display = 'none';
      tbody.innerHTML = '';

      try {
        const base64 = await fileToBase64(file);

        const formData = new FormData();
        formData.append('action', 'extractDeposit');
        formData.append('fileName', file.name);
        formData.append('imageBase64', base64.split(',')[1]);

        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (!data.ok) {
          resultBox.textContent = '오류 발생:\n' + data.message;
          return;
        }

        const rows = data.rows || [];

        const exactCount = rows.filter(row => row.동일인확인 === '동일인 확인').length;
        const warnCount = rows.filter(row => row.동일인확인 && row.동일인확인.includes('이름 불일치')).length;
        const failCount = rows.filter(row => row.동일인확인 === '미접수').length;

        summaryBox.innerHTML =
          `처리 완료<br>` +
          `추출 건수: <strong>${rows.length}</strong>건<br>` +
          `동일인 확인: <strong class="ok">${exactCount}</strong>건<br>` +
          `이름 불일치: <strong class="warn">${warnCount}</strong>건<br>` +
          `미접수: <strong class="fail">${failCount}</strong>건`;

        summaryBox.style.display = 'block';

        rows.forEach(row => {
          const tr = document.createElement('tr');

          const status = row.동일인확인 || '';
          let statusClass = '';

          if (status === '동일인 확인') statusClass = 'ok';
          else if (status.includes('이름 불일치')) statusClass = 'warn';
          else if (status === '미접수') statusClass = 'fail';

          tr.innerHTML = `
            <td>${row.거래일시 || ''}</td>
            <td>${row.동 || ''}</td>
            <td>${row.호수 || ''}</td>
            <td>${row.이름 || ''}</td>
            <td>${Number(row.거래금액 || 0).toLocaleString()}</td>
            <td class="${statusClass}">${status}</td>
          `;

          tbody.appendChild(tr);
        });

        table.style.display = 'table';

        resultBox.textContent =
          JSON.stringify(data.rows, null, 2);

      } catch (err) {
        resultBox.textContent = '업로드 실패:\n' + err.message;
      } finally {
        uploadBtn.disabled = false;
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);

        reader.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
